name: audit
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Hygiene gate (no local paths, secrets, keys, game assets, RE material, or unguarded test hooks)
        run: python scripts/hygiene_gate.py

  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies and pinned Rust
        run: |
          python -m pip install cryptography uv
          rustup show
      - name: Current ASX portable gate
        run: |
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          sh tools/dev/check.sh --profile full --reason 'CI current ASX source checks'
      - name: Required Lua 5.1 presentation behavior
        run: uv run --with lupa==2.6 python tests/test_official_party_lua.py

  native-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the pinned Rust toolchain
        run: rustup show
      - name: Native reproducer manifest and target-path contracts (mocked build)
        run: python -m unittest tests.test_windows_reproduction -v
      - name: Stand-in Windows unit and ABI tests (no game)
        run: cargo test --locked -p azeroth-coop-native --lib --features test-hooks -- --test-threads=1

  reproduce:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: rustup show
      - name: Reproducible ASX rebuild against an approved artifact
        shell: pwsh
        run: powershell -NoProfile -File scripts/reproduce.ps1
